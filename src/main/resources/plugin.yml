# El nombre "EconomyItems" se mantiene desde v1: define la carpeta plugins/EconomyItems
# y la clave interna de las monedas (economyitems:currency-id). No cambiarlo.
name: EconomyItems
main: cl.auryx.economy.EconomyPlugin
version: ${version}
description: Monedas físicas incrafteables para economías de servidor.
api-version: "26.1"
authors: [ItsTuki, DSieghard]
website: https://github.com/ItsTuki/economy-system

# Los comandos /economy y /coins se registran con Brigadier desde el código.
permissions:
  economy.admin:
    description: Acceso completo a /economy.
    default: op
    children:
      economy.admin.list: true
      economy.admin.give: true
      economy.admin.take: true
      economy.admin.remove: true
      economy.admin.balance: true
      economy.admin.add: true
      economy.admin.info: true
      economy.admin.reload: true
      economy.coins: true
  economy.admin.list:
    description: /economy list
    default: op
  economy.admin.give:
    description: /economy give
    default: op
  economy.admin.take:
    description: /economy take
    default: op
  economy.admin.remove:
    description: /economy remove
    default: op
  economy.admin.balance:
    description: /economy balance
    default: op
  economy.admin.add:
    description: /economy add (crear monedas)
    default: op
  economy.admin.info:
    description: /economy info
    default: op
  economy.admin.reload:
    description: /economy reload
    default: op
  economy.coins:
    description: Todos los comandos de jugador de /coins.
    default: true
    children:
      economy.coins.balance: true
      economy.coins.exchange: true
      economy.coins.condense: true
      economy.coins.pay: true
  economy.coins.balance:
    description: /coins (ver tus monedas)
    default: true
  economy.coins.exchange:
    description: /coins exchange
    default: true
  economy.coins.condense:
    description: /coins condense
    default: true
  economy.coins.pay:
    description: /coins pay
    default: true
